services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfdiff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfdiff}
      POSTGRES_DB: ${POSTGRES_DB:-pdfdiff}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_EXPOSE:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfdiff}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT_EXPOSE:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      STORAGE_DIR: /data/storage
      CACHE_DIR: /data/cache
    volumes:
      - storage:/data/storage
      - cache:/data/cache
      - ./backend:/app  # 开发期挂载源码热重载，生产可移除
    ports:
      - "${API_PORT_EXPOSE:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      STORAGE_DIR: /data/storage
      CACHE_DIR: /data/cache
    volumes:
      - storage:/data/storage
      - cache:/data/cache
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.runner"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_EXPOSE:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  storage:
  cache:
